
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS 2.0</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at center, #102d49, #030914 70%);
  color: #dff8ff;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px;
}

h1 {
  color: #39d9ff;
  letter-spacing: 7px;
  text-shadow: 0 0 20px #00aaff;
  margin-top: 25px;
}

.subtitle {
  color: #6caecb;
  letter-spacing: 3px;
  font-size: 12px;
}

.reactor {
  width: 190px;
  height: 190px;
  margin: 45px auto 30px;
  border: 3px solid #24caff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 25px #008cff,
              inset 0 0 25px #008cff;
  animation: pulse 2s infinite;
}

.core {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: #35dfff;
  box-shadow: 0 0 45px #00bfff;
  animation: core 3s infinite alternate;
}

@keyframes pulse {
  50% { transform: scale(1.08); opacity: .7; }
}

@keyframes core {
  to { box-shadow: 0 0 65px #00eaff; }
}

.panel {
  max-width: 500px;
  margin: 20px auto;
  padding: 18px;
  background: rgba(8, 29, 49, .85);
  border: 1px solid #12618a;
  border-radius: 16px;
  box-shadow: 0 0 20px #003c60;
}

#status {
  color: #42dfff;
  margin: 20px;
}

input {
  width: 100%;
  padding: 15px;
  margin: 8px 0;
  border-radius: 10px;
  border: 1px solid #20caff;
  background: #08182a;
  color: white;
  font-size: 16px;
}

button {
  background: #07375a;
  color: white;
  border: 1px solid #20caff;
  border-radius: 10px;
  padding: 13px 18px;
  margin: 5px;
  font-size: 15px;
}

button:active {
  background: #087eae;
}

#answer {
  min-height: 60px;
  line-height: 1.5;
  color: #c5f3ff;
}

.indicator {
  color: #35dfff;
  font-size: 13px;
  margin: 8px;
}

</style>
</head>

<body>

<h1>J.A.R.V.I.S.</h1>
<p class="subtitle">PERSONAL AI ASSISTANT 2.0</p>

<div class="reactor">
  <div class="core"></div>
</div>

<p id="status">SYSTEM ONLINE</p>

<div class="panel">
  <p class="indicator">● SYSTEM STATUS: OPERATIONAL</p>
  <p class="indicator">● VOICE MODULE: READY</p>
  <p class="indicator">● AI MODULE: LOCAL COMMANDS</p>
</div>

<div class="panel">
  <button onclick="startListening()">🎤 SPRACHSTEUERUNG</button>
  <button onclick="stopSpeaking()">⏹ STOPP</button>

  <input id="command"
    placeholder="Schreibe einen Befehl ...">

  <button onclick="sendCommand()">SENDEN</button>
</div>

<div class="panel">
  <h3>JARVIS MELDUNG</h3>
  <div id="answer">
    Willkommen zurück. Alle Systeme sind bereit.
  </div>
</div>

<script>
const statusText = document.getElementById("status");
const answer = document.getElementById("answer");

function speak(text) {
  answer.textContent = text;

  if (!("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = "de-DE";
  speech.rate = 0.96;
  speech.pitch = 0.88;

  speechSynthesis.speak(speech);
}

function stopSpeaking() {
  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }
  answer.textContent = "Sprachausgabe gestoppt.";
}

function processCommand(command) {
  command = command.toLowerCase();

  if (command.includes("hallo") ||
      command.includes("hey jarvis")) {
    speak("Guten Tag. JARVIS ist bereit.");
  }

  else if (command.includes("wie spät")) {
    speak("Es ist " +
      new Date().toLocaleTimeString("de-DE") + " Uhr.");
  }

  else if (command.includes("datum")) {
    speak("Heute ist der " +
      new Date().toLocaleDateString("de-DE"));
  }

  else if (command.includes("youtube")) {
    speak("Ich öffne YouTube.");
    window.open("https://www.youtube.com", "_blank");
  }

  else if (command.includes("dein name")) {
    speak("Mein Name ist JARVIS. Ihr persönlicher Assistent.");
  }

  else if (command.includes("hilfe")) {
    speak("Du kannst mich nach der Uhrzeit und dem Datum fragen oder YouTube öffnen lassen.");
  }

  else {
    speak("Diesen Befehl kenne ich noch nicht. Das KI-Modul wird später erweitert.");
  }
}

function sendCommand() {
  const input = document.getElementById("command");

  if (!input.value.trim()) return;

  processCommand(input.value);
  input.value = "";
}

function startListening() {
  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Recognition) {
    speak("Dein Browser unterstützt keine Spracherkennung.");
    return;
  }

  const recognition = new Recognition();

  recognition.lang = "de-DE";
  recognition.continuous = false;
  recognition.interimResults = false;

  statusText.textContent = "ICH HÖRE ZU ...";

  recognition.onresult = function(event) {
    const text = event.results[0][0].transcript;
    statusText.textContent = "BEFEHL ERKANNT";
    processCommand(text);
  };

  recognition.onerror = function() {
    statusText.textContent = "SPRACHERKENNUNG FEHLGESCHLAGEN";
  };

  recognition.onend = function() {
    statusText.textContent = "SYSTEM ONLINE";
  };

  recognition.start();
}

document.getElementById("command")
  .addEventListener("keydown", function(event) {
    if (event.key === "Enter") sendCommand();
  });
</script>

</body>
</html>
